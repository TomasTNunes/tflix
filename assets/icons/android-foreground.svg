<svg xmlns="http://www.w3.org/2000/svg" viewBox="-128 -128 768 768" width="1024" height="1024">
  <!-- Foreground layer of the Android adaptive icon (108dp canvas). Same artwork as
       icon.svg, with the tile left to the background layer and the beam carried on
       past the tile edge so it reaches the edge of any launcher's icon shape. -->
  <defs>
    <linearGradient id="beam" gradientUnits="userSpaceOnUse" x1="0" y1="170" x2="0" y2="512">
      <stop offset="0" stop-color="#ff3a44" stop-opacity="1"/>
      <stop offset="1" stop-color="#ff3a44" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="26"/></filter>
  </defs>
  <rect x="88" y="92" width="336" height="92" rx="16" fill="#ff1a26" filter="url(#glow)" opacity="0.7"/>
  <polygon points="196,170 316,170 384.7,640 127.3,640" fill="url(#beam)"/>
  <rect x="88" y="92" width="336" height="92" rx="16" fill="#ff2a35"/>
</svg>
